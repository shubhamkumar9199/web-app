<!--
  COMPONENT 3 — AI ACTION BAR
  Sticky bar at bottom showing available AI actions
-->
<div class="ai-action-bar">
  <!-- Left: Logo + Text -->
  <div class="ai-action-bar__left">
    <div class="ai-action-bar__logo"></div>
    <span class="ai-action-bar__text">AI found actions for this client</span>
  </div>

  <!-- Center: Count Badge -->
  <span class="ai-action-bar__badge">3</span>

  <!-- Right: Show Actions Button -->
  <button class="ai-action-bar__btn">
    Show actions
    <span class="ai-action-bar__btn__arrow">↑</span>
  </button>
</div>


<!--
  VARIANT: Minimized Action Bar
-->
<div class="ai-action-bar ai-action-bar--minimized">
  <div class="ai-action-bar__logo"></div>
  <span class="ai-action-bar__badge">3</span>
</div>
