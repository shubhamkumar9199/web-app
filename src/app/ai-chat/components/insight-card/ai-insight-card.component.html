<!--
  COMPONENT 2 — INSIGHT CARD
  Dark floating card with AI insight
-->
<div class="ai-insight-card ai-insight-card--with-arrow">
  <!-- Header -->
  <div class="ai-insight-card__header">
    <div class="ai-insight-card__icon-box"></div>
    <span class="ai-insight-card__title">AI Insight</span>
  </div>

  <!-- Body -->
  <p class="ai-insight-card__body">
    This client has <span class="ai-insight-card__highlight">₹12,500</span>
    pending dues and excellent repayment history. Consider offering
    <span class="ai-insight-card__highlight">top-up loan</span>.
  </p>

  <!-- Actions -->
  <div class="ai-insight-card__actions">
    <button class="ai-insight-card__btn ai-insight-card__btn--primary">
      Review & act
    </button>
    <button class="ai-insight-card__btn ai-insight-card__btn--secondary">
      Dismiss
    </button>
  </div>
</div>
